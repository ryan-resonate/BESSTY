[package]
name = "beesty-solver"
version = "0.1.0"
edition = "2021"
description = "ISO 9613-2:2024 outdoor noise solver with forward-mode AD, targeting WebAssembly."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
smallvec = "1.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"

# Disable wasm-opt during `wasm-pack build`.
#
# Rust / wasm-bindgen now produce WebAssembly modules with multiple table
# sections (post-MVP feature) needed for indirect-function-call dispatch.
# The version of `wasm-opt` cached by `jetli/wasm-pack-action` in CI is an
# older MVP-only build that crashes on parse with:
#
#     [parse exception: Only 1 table definition allowed in MVP]
#
# We don't actually need wasm-opt: the Rust release profile already does
# LTO + opt-level 3 + codegen-units = 1, which is most of what wasm-opt
# would do anyway. The size delta from skipping wasm-opt is a few KB on
# our ~70 KB output -- well worth not blocking the deploy on a toolchain
# version mismatch.
#
# If we ever want it back, the right fix is to pin wasm-pack to a version
# whose bundled wasm-opt understands the multi-table extension (binaryen
# 116+). Until then, off.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
