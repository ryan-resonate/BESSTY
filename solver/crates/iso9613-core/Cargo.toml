[package]
name = "iso9613-core"
version = "0.5.0"
edition = "2021"
description = "ISO 9613-2 outdoor sound propagation engine. Proprietary — Resonate Consultants internal use only."
license-file = "../../LICENSE"
publish = false

[dependencies]
smallvec = "1.13"
serde = { version = "1", features = ["derive"] }
rayon = { version = "1", optional = true }

[features]
# Native multithreading over receivers/grid points via rayon. OFF by default so
# wasm builds stay single-threaded (the web target drives concurrency with its
# own Web-Worker pool, not rayon/SharedArrayBuffer).
parallel = ["dep:rayon"]

[dev-dependencies]
approx = "0.5"
serde_json = "1"
