[package]
name = "iso9613-wasm"
version = "0.5.0"
edition = "2021"
description = "WebAssembly bindings for iso9613-core (flat compat API consumed by BEESTY). Proprietary — Resonate Consultants internal use only."
license-file = "../../LICENSE"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
iso9613-core = { path = "../iso9613-core" }
wasm-bindgen = "0.2"

# Disable wasm-opt during `wasm-pack build`.
#
# Rust / wasm-bindgen produce WebAssembly modules with multiple table sections
# (post-MVP feature). Older wasm-opt builds cached in CI crash on parse with
# "Only 1 table definition allowed in MVP". The Rust release profile already
# does LTO + opt-level 3 + codegen-units = 1, which is most of what wasm-opt
# would add; the size delta is a few KB. If it ever comes back, pin a
# wasm-pack whose bundled binaryen is 116+.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
