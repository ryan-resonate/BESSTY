[package]
name = "iso9613-wasm"
version = "0.5.0"
edition = "2021"
description = "WebAssembly bindings for iso9613-core (Scene JSON API consumed by BEESTY). Proprietary — Resonate Consultants internal use only."
license-file = "../../LICENSE"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
iso9613-core = { path = "../iso9613-core" }
wasm-bindgen = "0.2"
serde_json = "1"

# Readable panic traces in the browser console. Debug builds only — a release
# wasm should never panic (every fallible export returns `JsError`), and the
# hook costs binary size.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

# Size-optimise with wasm-opt. The Scene API pulls in serde_json, which takes
# the raw module to ~525 KB; `-Oz` brings it back to ~436 KB.
#
# (History: wasm-opt used to be disabled here because older binaryen crashed on
# wasm-bindgen's multiple table sections — "Only 1 table definition allowed in
# MVP". The bundled binaryen is now new enough; if that error ever returns, set
# `wasm-opt = false` and instead trim with opt-level = "z".)
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz']
